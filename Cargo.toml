[package]
name = "qed-prover"
version = "0.1.0"
authors = ["Shuxian Wang <wsx@berkeley.edu>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde-enum-str = "0.3"
serde_json = "1.0"
z3 = { git = "https://github.com/wsx-ucb/z3.rs", branch = "add-binding" }
scopeguard = "1.1"
itertools = "0.10"
permutation = "0.2"
paste = "1.0"
indenter = "0.3"
log = "0.4"
env_logger = "0.10"
imbl = { version = "2.0", features = ["serde"] }
anyhow = "1.0"
num = "0.4"
crossbeam = { git = "https://github.com/crossbeam-rs/crossbeam", branch = "master" }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
redis = { version = "0.32.2", features = ["tokio-comp", "connection-manager"] }
native-tls = "0.2"
once_cell = "1.19"
bincode = "1.3"
hex = "0.4"
sha2 = "0.10"
serde_with = "3.13.0"
